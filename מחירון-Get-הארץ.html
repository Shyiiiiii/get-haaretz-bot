const F=document.getElementById('from'),T=document.getElementById('to');
let pax=0, rt=false;

// רשימת יעדים = ערים + שכונות ירושלים
const HOODSET=new Set(D.hoods);
const ALL=[...D.cities.map(c=>({n:c,t:''})),...D.hoods.map(h=>({n:h,t:'שכונה בירושלים'}))];

function cityOf(name){ return HOODSET.has(name)?'ירושלים':name; }
function hoodOf(name){ return HOODSET.has(name)?name:null; }

function findPrice(a,b){
  const ca=cityOf(a), cb=cityOf(b), hood=hoodOf(b)||hoodOf(a);
  // 1) חריג שכונתי
  if(hood){
    for(const k of [ca+' → '+cb, cb+' → '+ca]){
      const o=D.hoodOv[k]; if(o&&o[hood]!=null) return {p:o[hood],src:'own',hood};
    }
  }
  // 2) מסלול ישיר (סימטרי)
  const r=D.routes[ca+' → '+cb]||D.routes[cb+' → '+ca];
  if(r) return {...r};
  return null;
}

function fleetFor(p){ if(!p) return null; return D.fleet.find(v=>p<=v.max)||D.fleet[D.fleet.length-1]; }

function render(){
  const a=F.value.trim(), b=T.value.trim(), R=document.getElementById('res');
  if(!a||!b){ R.innerHTML='<div class="empty">בחר מוצא ויעד לקבלת מחיר</div>'; return; }
  const hit=findPrice(a,b);
  const veh=fleetFor(pax);
  if(!hit){
    R.innerHTML='<div class="route"><b>'+esc(a)+'</b> ⟵⟶ <b>'+esc(b)+'</b></div>'+
      '<div class="empty">אין מחיר מאומת למסלול זה.<br>נקבע מחיר אישי.</div>'+
      '<a class="wa" href="https://wa.me/972506567045?text='+encodeURIComponent('נסיעה מ'+a+' ל'+b)+'">תאם בוואטסאפ</a>';
    return;
  }
  let price=hit.p;
  if(veh) price=Math.round(price*veh.mult);
  if(rt) price*=2;
  const badge = hit.src==='own'
    ? '<span class="badge b-own">המחירון שלך</span>'
    : '<span class="badge b-mkt">מחיר שוק · '+hit.n+' דגימות · '+hit.a+'% הסכמה</span>';
  R.innerHTML='<div class="route"><b>'+esc(a)+'</b> ⟵⟶ <b>'+esc(b)+'</b></div>'+
    '<div class="price">'+price+'<small>₪</small></div>'+
    '<div class="meta">'+(veh?veh.name+' · ':'')+(rt?'הלוך-חזור':'כיוון אחד')+
      (hit.hood?'<br>תעריף שכונה: '+hit.hood:'')+'</div>'+badge+
    '<a class="wa" href="https://wa.me/972506567045?text='+encodeURIComponent('נסיעה מ'+a+' ל'+b+' — '+price+'₪')+'">שלח בוואטסאפ</a>';
}
function esc(s){return String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}

// ── השלמה אוטומטית ──
function wire(inp,box){
  let idx=-1;
  inp.addEventListener('input',()=>{
    const q=inp.value.trim(); idx=-1;
    if(!q){box.classList.remove('on');render();return;}
    const list=ALL.filter(o=>o.n.includes(q)).slice(0,8);
    if(!list.length){box.classList.remove('on');render();return;}
    box.innerHTML=list.map(o=>'<div data-v="'+o.n+'">'+o.n+(o.t?'<span class="tag">'+o.t+'</span>':'')+'</div>').join('');
    box.classList.add('on');
    [...box.children].forEach(el=>el.onclick=()=>{inp.value=el.dataset.v;box.classList.remove('on');render();});
    render();
  });
  inp.addEventListener('keydown',e=>{
    const items=[...box.children]; if(!items.length)return;
    if(e.key==='ArrowDown'){e.preventDefault();idx=Math.min(idx+1,items.length-1);}
    else if(e.key==='ArrowUp'){e.preventDefault();idx=Math.max(idx-1,0);}
    else if(e.key==='Enter'&&idx>=0){e.preventDefault();inp.value=items[idx].dataset.v;box.classList.remove('on');render();return;}
    else return;
    items.forEach(i=>i.classList.remove('sel')); items[idx].classList.add('sel');
    items[idx].scrollIntoView({block:'nearest'});
  });
  inp.addEventListener('blur',()=>setTimeout(()=>box.classList.remove('on'),180));
}
wire(F,document.getElementById('sfrom'));
wire(T,document.getElementById('sto'));

document.getElementById('swap').onclick=()=>{const t=F.value;F.value=T.value;T.value=t;render();};
document.querySelectorAll('#opts .chip[data-pax]').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('#opts .chip[data-pax]').forEach(x=>x.classList.remove('on'));
  c.classList.add('on'); pax=+c.dataset.pax; render();
});
document.getElementById('rt').onclick=function(){ rt=!rt; this.classList.toggle('on'); render(); };

const own=Object.entries(D.routes).filter(([,v])=>v.src==='own');

const quick=[...own.slice(0,8),...mkt.slice(0,8)].slice(0,14);
document.getElementById('quick').innerHTML=quick.map(([k,v])=>{
  const [a,b]=k.split(' → ');
  return '<div class="q" data-a="'+a+'" data-b="'+b+'"><span>'+a+' ⟵⟶ '+b+'</span><b>'+v.p+'₪</b></div>';
}).join('');
document.querySelectorAll('.q').forEach(q=>q.onclick=()=>{
  F.value=q.dataset.a; T.value=q.dataset.b; render();
  document.getElementById('res').scrollIntoView({behavior:'smooth',block:'center'});
});
