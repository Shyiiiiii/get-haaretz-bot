<style>
:root{--navy:#070d1f;--card:#0d1733;--card2:#111d3d;--line:rgba(255,255,255,.10);

body{padding:18px 14px 60px}
.w{max-width:620px;margin:0 auto}
header{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
h1{font-family:"Frank Ruhl Libre",serif;font-size:27px;margin:0}
h1 span{color:var(--gold)}
.sub{color:var(--dim);font-size:13px;margin:0 0 20px}

.field{margin-bottom:12px;position:relative}
label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px;font-weight:600}
input[type=text]{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);

input[type=text]:focus{border-color:var(--gold);background:var(--card2)}
input::placeholder{color:#5d6a8f}
.sug{position:absolute;top:100%;right:0;left:0;background:var(--card2);border:1px solid var(--line);
 border-radius:12px;margin-top:5px;max-height:240px;overflow-y:auto;z-index:30;display:none;
 box-shadow:0 12px 34px rgba(0,0,0,.5)}
.sug.on{display:block}
.sug div{padding:12px 15px;cursor:pointer;font-size:16px;border-bottom:1px solid var(--line)}
.sug div:last-child{border:0}
.sug div:hover,.sug div.sel{background:rgba(245,184,30,.16);color:var(--gold2)}
.sug .tag{float:left;font-size:11px;color:var(--dim)}

.swap{display:flex;justify-content:center;margin:-4px 0 8px}
.swap button{background:var(--card);border:1px solid var(--line);color:var(--gold);

.swap button:active{transform:scale(.92)}

.opts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--dim);padding:9px 14px;

.chip.on{background:var(--gold);color:#111;border-color:var(--gold)}

.result{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);
 border-radius:18px;padding:26px 22px;text-align:center;min-height:150px;display:flex;
 flex-direction:column;justify-content:center;align-items:center}
.result .route{font-size:15px;color:var(--dim);margin-bottom:12px}
.result .route b{color:var(--ink)}
.price{font-family:"Frank Ruhl Libre",serif;font-size:64px;font-weight:900;color:var(--gold);line-height:1}
.price small{font-size:28px}
.meta{margin-top:12px;font-size:13px;color:var(--dim);line-height:1.7}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-top:9px}
.b-own{background:rgba(245,184,30,.18);color:var(--gold2)}
.b-mkt{background:rgba(104,211,145,.15);color:var(--ok)}
.b-est{background:rgba(255,255,255,.08);color:var(--dim)}
.b-pub{background:rgba(120,170,255,.16);color:#9dc0ff}
.empty{color:var(--dim);font-size:15px}
.wa{display:inline-block;margin-top:16px;background:#25D366;color:#062b14;padding:11px 22px;
 border-radius:11px;text-decoration:none;font-weight:800;font-size:15px}

h2{font-family:"Frank Ruhl Libre",serif;font-size:19px;margin:30px 0 10px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}

footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);color:var(--dim);font-size:12px;text-align:center;line-height:1.8}

  if(!hit){
    R.innerHTML='<div class="route"><b>'+esc(a)+'</b> ⟵⟶ <b>'+esc(b)+'</b></div>'+
      '<div class="empty">אין מחיר מאומת למסלול זה.<br>נקבע מחיר אישי.</div>'+
      '<a class="wa" href="https://wa.me/972506567045?text='+encodeURIComponent('נסיעה מ'+a+' ל'+b)+'">תאם בוואטסאפ</a>';
    return;
  }
  let price=hit.p, pmax=hit.max||null;
  if(rt){price=price*2-40; if(pmax)pmax=pmax*2-40;}
  price=roundTo(price); if(pmax)pmax=roundTo(pmax);
  lastPrice={a:esc(a),b:esc(b),price:price};
  const badge = hit.src==='own'
    ? '<span class="badge b-own">'+(hit.ok?'✅ מאושר על ידך':'המחירון שלך · לאימות')+'</span>'
    : hit.src==='pub'
      ? '<span class="badge b-pub">מחירון מפורסם</span>'
      : '<span class="badge b-mkt">מחיר שוק · '+hit.n+' דגימות · '+hit.a+'% הסכמה</span>';
  pushRecent(a,b);
  R.innerHTML='<div class="route"><b>'+esc(a)+'</b> ⟵⟶ <b>'+esc(b)+'</b></div>'+
    '<div class="price">'+price+(pmax&&pmax!==price?'<small>-'+pmax+'</small>':'')+'<small>₪</small></div>'+
    '<div class="meta">'+(rt?'הלו״ש · כולל עד שעת המתנה':'כיוון אחד')+
      (hit.hood?'<br>תעריף שכונה: '+hit.hood:'')+'</div>'+badge+
    '<a class="wa" href="https://wa.me/972506567045?text='+encodeURIComponent('נסיעה מ'+a+' ל'+b+' — '+price+'₪')+'">שלח בוואטסאפ</a>';
}
function esc(s){return String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}

// ── השלמה אוטומטית ──
function wire(inp,box){
  let idx=-1;
  inp.addEventListener('input',()=>{
    const q=inp.value.trim(); idx=-1;
    if(!q){box.classList.remove('on');render();return;}
    const list=ALL.filter(o=>o.n.includes(q)).slice(0,8);
    if(!list.length){box.classList.remove('on');render();return;}
    box.innerHTML=list.map(o=>'<div data-v="'+o.n+'">'+o.n+(o.t?'<span class="tag">'+o.t+'</span>':'')+'</div>').join('');
    box.classList.add('on');
    [...box.children].forEach(el=>el.onclick=()=>{inp.value=el.dataset.v;box.classList.remove('on');render();});
    render();
  });
  inp.addEventListener('keydown',e=>{
    const items=[...box.children]; if(!items.length)return;
    if(e.key==='ArrowDown'){e.preventDefault();idx=Math.min(idx+1,items.length-1);}
    else if(e.key==='ArrowUp'){e.preventDefault();idx=Math.max(idx-1,0);}
    else if(e.key==='Enter'&&idx>=0){e.preventDefault();inp.value=items[idx].dataset.v;box.classList.remove('on');render();return;}
    else return;
    items.forEach(i=>i.classList.remove('sel')); items[idx].classList.add('sel');
    items[idx].scrollIntoView({block:'nearest'});
  });
  inp.addEventListener('blur',()=>setTimeout(()=>box.classList.remove('on'),180));
}
wire(F,document.getElementById('sfrom'));
wire(T,document.getElementById('sto'));

document.getElementById('swap').onclick=()=>{const t=F.value;F.value=T.value;T.value=t;render();};
document.getElementById('rt').onclick=function(){ rt=!rt; this.classList.toggle('on'); render(); };
document.getElementById('rnd').onclick=function(){
  const i=(RND.indexOf(rnd)+1)%RND.length; rnd=RND[i];
  this.textContent='עיגול: '+(rnd?'ל-'+rnd+'₪':'בלי');
  this.classList.toggle('on', rnd>0); render();
};
document.getElementById('copy').onclick=async function(){
  if(!lastPrice) return;
  const txt=lastPrice.a+' ⟵⟶ '+lastPrice.b+' — '+lastPrice.price+'₪';
  try{ await navigator.clipboard.writeText(txt); this.textContent='✅ הועתק'; setTimeout(()=>this.textContent='📋 העתק',1400);}catch(e){}
};
drawRecent();
F.focus();

const mkt=Object.entries(D.routes).filter(([,v])=>v.src==='market').sort((a,b)=>b[1].n-a[1].n);

document.querySelectorAll('.q').forEach(q=>q.onclick=()=>{
  F.value=q.dataset.a; T.value=q.dataset.b; render();
  document.getElementById('res').scrollIntoView({behavior:'smooth',block:'center'});
